[project]
name = "audit"
version = "0.1.0"
description = "Claim-level auditing of reward-hacking transcripts."
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "pyyaml",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pytest",
    "inspect-ai",
    # [CHECK: whether ImpossibleBench is installed as a package or vendored; add it once Dima confirms.]
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]
