[project]
name = "audit"
version = "0.1.0"
description = "Claim-level auditing of reward-hacking transcripts."
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "pyyaml",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pytest",
    "inspect-ai",
    # Not on PyPI. Pinned to a commit, not a branch, because the label logic in
    # transcripts.py depends on the record_to_sample default at this commit.
    "impossiblebench",
]

[tool.uv.sources]
impossiblebench = { git = "https://github.com/safety-research/impossiblebench", rev = "061dc3dce6a96ab6cf02a855157263033dcfa3ba" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.pytest.ini_options]
# Scope collection to our tests. The vendored impossiblebench clone ships its own.
testpaths = ["tests"]
