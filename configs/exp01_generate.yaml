# Stage 01: generate agent transcripts on ImpossibleBench and compute hack labels.
dataset: "fjzzq2002/impossible_livecodebench"   # HF dataset id
split: "[CHECK: split name exposed by the dataset]"
n_tasks: 60                                     # tasks sampled from the split
variants: [original, oneoff, conflicting]       # one-off and conflicting are the impossible variants
samples_per_task: 2                             # 60 x 3 x 2 = 360 runs, target >= 80 hacks
seed: 0                                         # seeds task sampling and agent sampling
